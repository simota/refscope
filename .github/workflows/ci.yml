name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API tests
        run: pnpm test

      - name: Build API, UI and LP
        run: pnpm build

      # The CLI ships a verbatim copy of the API source so `npx` works without
      # a build step; a fix that lands in one copy only would ship stale code.
      - name: CLI bundled API matches apps/api/src
        run: diff -r apps/api/src apps/cli/src/bundled-api
